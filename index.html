.list{background:var(--cd);border-radius:18px;overflow:hidden}

.pad{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0}

.seg{display:flex;background:var(--cd);border-radius:12px;padding:3px;margin:8px 0}

.sh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 6px 8px}.sh b{font-size:18px;letter-spacing:-.02em}.sh a{color:var(--ac);font-weight:600;font-size:14px}

function qr(){var s=U.qt=='mine'?7:3,r='',i,j,a,b,on;for(i=0;i<21;i++)for(j=0;j<21;j++){var f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);
if(f){a=i>13?i-14:i;b=j>13?j-14:j;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else on=((i*31+j*17+i*j*s)%7)<3;

var m=$('#main');m.innerHTML=h;m.className=anim===false?'':'in';
if(v=='home'&&anim!==false)count($('#bal'),S.bal);

$('header').innerHTML='<div class="hl"><button class="mn" data-a="nav:set">'+ico('M4 7h16M4 12h16M4 17h10')+'</button><div class="avc">'+esc((S.name[0]||'P').toUpperCase())+'</div><div><small>'+t('wel')+'</small><b>'+t('hi')+', '+esc(S.name)+'!</b></div></div><div class="hr"><b class="wm">Payly</b><button class="pill" data-a="dc">DEMO</button><button class="bell" data-a="nav:alerts">'+ico('M18 16v-5a6 6 0 10-12 0v5l-2 2h16zM10 21h4')+'<s></s></button></div>';$('#ft').textContent=t('foot')}
function ico(p){return'<svg viewBox="0 0 24 24"><path d="'+p+'"/></svg>'}

var qs=[['go:send','M12 19V5M6 11l6-6 6 6',t('send')],['go:request','M12 5v14M6 13l6 6 6-6',t('req')],['nav:scan','M3 6h18v12H3zM3 10h18',t('pay')],['nav:alerts','M18 16v-5a6 6 0 10-12 0v5l-2 2h16zM10 21h4',t('alert')]];

S.tx.slice(0,6).forEach(function(x){r.push({n:t(x.a>0?'a1':'a2'),s:info(x)[0]+' - '+fmt(x.a)+' - '+dt(x.dd),ic:x.a>0?'M12 5v14M6 13l6 6 6-6':'M12 19V5M6 11l6-6 6 6'})});
return'<div class="lg">'+t('alert')+'</div><div class="list">'+r.map(function(x,i){return'<div class="tx" style="--i:'+i+'"><div class="av">'+ico(x.ic)+'</div><div class="m"><b>'+esc(x.n)+'</b><span>'+esc(x.s)+'</span></div></div>'}).join('')+'</div>'}
function setV(){var lg=Object.keys(LG).map(function(k){return'<button class="'+(S.lang==k?'on':'')+'" data-a="lng:'+k+'">'+k.toUpperCase()+'</button>'}).join('');
function tg(l,k){return'<div class="sw"><span>'+l+'</span><button class="tg'+(S[k]?' on':'')+'" data-a="tgl:'+k+'"></button></div>'}
return'<div class="lg">'+t('set')+'</div><div class="list"><div class="sw" style="border:0"><div style="display:flex;gap:12px;align-items:center"><div class="avc">'+esc((S.name[0]||'P').toUpperCase())+'</div><div><b>'+esc(S.name)+'</b><br><span style="color:var(--mut);font-size:13px">$demo-user</span></div></div></div></div><h3>'+t('lang')+'</h3><div class="seg">'+lg+'</div><h3>'+t('pref')+'</h3><div class="list"><div class="sw"><span>'+t('dark')+'</span><button class="tg'+(S.dark?' on':'')+'" data-a="dk2"></button></div>'+tg(t('face'),'fid')+tg(t('notif'),'ntf')+'</div><button class="btn p" data-a="dc">'+t('dc')+'</button>'}
function go(m){U.mode=m;U.amt='';U.step=1;U.to='';U.note='';U.v='pay';view()}

'<label>'+t('col')+'</label><div class="cols">'+COL.map(function(c){return'<i data-a="col:'+c+'" class="'+(S.ac==c?'on':'')+'" style="background:'+c+'"></i>'}).join('')+'</div><div class="list" style="margin:10px 0"><div class="sw" style="border:0"><span>'+t('dark')+'</span><button class="tg'+(S.dark?' on':'')+'" data-a="dark"></button></div></div>'+
'<h3>'+t('addtx')+'</h3><input id="tn" placeholder="'+t('txn')+'"><input id="ta" type="number" step="0.01" placeholder="'+t('txa')+'"><input id="tt" placeholder="'+t('txnote')+'"><button class="btn p" data-a="addtx">'+t('addtx')+'</button><button class="btn" data-a="gen">'+t('gen')+'</button><button class="btn" data-a="clr">'+t('clr')+'</button><button class="btn" data-a="rst">'+t('rst')+'</button><button class="btn" data-a="close">'+t('done')+'</button>';s.innerHTML=h}
s.className=open?'o':'';$('#ov').className=open?'o':''}
$('#ov').onclick=function(){sheet(false)};
document.addEventListener('change',function(e){var i=e.target.id;
if(i=='sn'){S.name=e.target.value||'Alex';save();view(false)}
if(i=='sb'){var v=parseFloat(e.target.value);if(!isNaN(v)){S.bal=v;save();view(false)}}
if(i=='sl'){S.lang=e.target.value;save();view(false);sheet(true)}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var p=b.dataset.a.split(':'),a=p[0],x=p.slice(1).join(':'),n;
if(a=='nav'){if(x=='pay'){go('send');return}U.v=x;view()}
else if(a=='go')go(x);else if(a=='mode'){U.mode=x;view(false)}
else if(a=='k'){if(x=='del')U.amt=U.amt.slice(0,-1);else if(x=='.'){if(U.amt.indexOf('.')<0)U.amt=(U.amt||'0')+'.'}else{var d=U.amt.split('.');if(U.amt.length<9&&!(d[1]&&d[1].length>=2))U.amt+=x}view(false)}
else if(a=='next'){n=parseFloat(U.amt);if(!n||n<=0){toast(t('amt'));return}if((U.mode=='send'||U.mode=='cashout')&&n>S.bal){toast(t('nof'));return}
if(U.mode=='add'||U.mode=='cashout'){S.bal+=U.mode=='add'?n:-n;S.tx.unshift({k:'u',n:t('tl')[U.mode],a:U.mode=='add'?n:-n,note:'',dd:0});save();toast(t('done'));U.v='home';view()}else{U.step=2;view()}}
else if(a=='back'){U.to=$('#to').value;U.note=$('#nt').value;U.step=1;view(false)}
else if(a=='conf'){var to=$('#to').value.trim();n=parseFloat(U.amt);if(!to){toast(t('who'));return}
if(U.mode=='send'){S.bal-=n;S.tx.unshift({k:'u',n:to,a:-n,note:$('#nt').value,dd:0});toast(t('sent')+' '+fmt(n))}else{S.tx.unshift({k:'u',n:to,a:n,note:$('#nt').value,dd:0,p:1});toast(t('reqd'))}

else if(a=='close')sheet(false);else if(a=='dc')sheet(true);else if(a=='dk2'){S.dark=!S.dark;save();theme();view(false)}else if(a=='tgl'){S[x]=!S[x];save();view(false)}else if(a=='lng'){S.lang=x;save();view(false)}});
